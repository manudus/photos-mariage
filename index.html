<body>

<div class="container">

  <h1 class="title">
    Mariage Valérie & Manu
  </h1>

  <div class="card" id="loginBox">

    <h2>Accès privé</h2>

    <input type="password"
           id="pwd"
           placeholder="Mot de passe">

    <button onclick="login()">
      Entrer
    </button>

    <p id="error"></p>

  </div>

  <div class="card"
       id="uploadBox"
       style="display:none;">

    <h2>Déposer vos photos</h2>

    <input type="file"
           id="files"
           multiple
           accept="image/*">

    <button onclick="uploadFiles()">
      Envoyer
    </button>

    <div class="progress-container">
      <div id="progressBar"></div>
    </div>

    <p id="status"></p>

  </div>

</div>

<script src="app.js"></script>

</body>
