<!DOCTYPE html>
<html lang="fr">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Photos Mariage</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<h1 class="title">
  Mariage Valérie & Manu
</h1>
<div class="card" id="loginBox">
  <h1>Accès privé</h1>
  <input type="password" id="pwd" placeholder="Mot de passe">
  <button onclick="login()">Entrer</button>
  <p id="error"></p>
</div>

<div class="card" id="uploadBox" style="display:none;">
  <h1>Upload Photos</h1>

  <input type="file" id="files" multiple accept="image/*">
  <button onclick="uploadFiles()">Envoyer</button>

  <div class="progress-container">
    <div id="progressBar"></div>
  </div>

  <p id="status"></p>
</div>

<script src="app.js"></script>
</body>
</html>
