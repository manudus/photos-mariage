<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Valérie & Manu - Photos</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1 class="title">Valérie & Manu</h1>

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <h2>Accès privé</h2>
    <input type="password" id="pwd" placeholder="Mot de passe">
    <button onclick="login()">Entrer</button>
    <p id="error"></p>
  </div>

  <!-- UPLOAD -->
  <div id="uploadBox" class="card hidden">

    <h2>Ajouter vos photos</h2>

    <input type="file" id="files" multiple accept="image/*">
    <button onclick="uploadFiles()">Envoyer</button>

    <div class="progress-container">
      <div id="progressBar"></div>
    </div>

    <p id="status"></p>

    <h2 class="gallery-title">Galerie</h2>
    <div id="gallery"></div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
