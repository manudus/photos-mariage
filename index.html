<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>
Valérie & Manu • Photos
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="card">

<h1>
Valérie & Manu
</h1>

<p class="subtitle">

Partagez vos plus beaux souvenirs ❤️

</p>

<input
type="file"
id="files"
multiple
accept="image/*">

<button
onclick="uploadFiles()">

Envoyer mes photos

</button>

<div class="progress">

<div id="bar"></div>

</div>

<p id="status"></p>

</div>

<!-- POPUP -->

<div
id="popup"
class="popup hidden">

<div class="popup-content">

<div id="confetti"></div>

<h2>
🎉 Merci !
</h2>

<p>

Vos photos ont bien été envoyées.

</p>

<button
onclick="resetUpload()">

Ajouter d'autres photos

</button>

<a
class="gallery-link"
target="_blank"
href="https://drive.google.com/drive/folders/1UoR85yF4yDGOTv95uUo-EkTZSq7nsjCn?hl=fr">

Voir la galerie (si compte Google)

</a>

</div>

</div>

<script src="app.js"></script>

</body>

</html>
