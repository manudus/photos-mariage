<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Valérie & Manu - Photos</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1 class="title">Valérie & Manu</h1>

<!-- LOGIN -->
<div id="loginBox" class="card">

<h2>Accès privé</h2>

<input type="password" id="pwd" placeholder="Mot de passe">

<button id="loginBtn">Entrer</button>

<p id="error"></p>

</div>

<!-- UPLOAD -->
<div id="uploadBox" class="card hidden">

<h2>Ajouter vos photos</h2>

<input type="file" id="files" multiple accept="image/*">

<button id="uploadBtn">Envoyer</button>

<p id="status"></p>

<h2>Galerie</h2>
<div id="gallery"></div>

</div>

</div>

<script src="app.js"></script>

</body>

</html>
